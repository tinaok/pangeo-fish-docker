name: Build and publish image

on:
  # changes to the Dockerfile / workflow in this repository
  push:
    branches: [main]
  # daily check for a new pangeo-notebook release or a new pangeo-fish commit
  schedule:
    - cron: "0 4 * * *"
  # immediate rebuild, sent by pangeo-fish/pangeo-fish on push to main
  # (see extras/notify-docker-image.yml)
  repository_dispatch:
    types: [pangeo-fish-updated]
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if an image for these versions already exists"
        type: boolean
        default: false
      pangeo_notebook_tag:
        description: "pangeo/pangeo-notebook tag (empty = 2026.06.04)"
        required: false
        default: ""
      pangeo_fish_ref:
        description: "pangeo-fish fork branch, tag or commit (empty = IBI + coastal fixes)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pangeo-fish-notebook
  PANGEO_FISH_REPO: https://github.com/tinaok/pangeo-fish.git

jobs:
  resolve:
    name: Resolve versions
    runs-on: ubuntu-latest
    outputs:
      notebook_tag: ${{ steps.versions.outputs.notebook_tag }}
      fish_sha: ${{ steps.versions.outputs.fish_sha }}
      image_tag: ${{ steps.versions.outputs.image_tag }}
      is_default: ${{ steps.versions.outputs.is_default }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Resolve pangeo-notebook tag and pangeo-fish commit
        id: versions
        env:
          INPUT_NOTEBOOK_TAG: ${{ inputs.pangeo_notebook_tag }}
          INPUT_FISH_REF: ${{ inputs.pangeo_fish_ref }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail

          # Keep the workshop base image and pin the validated IBI/coastal source.
          notebook_tag="${INPUT_NOTEBOOK_TAG:-2026.06.04}"
          fish_ref="${INPUT_FISH_REF:-${PAYLOAD_SHA:-3c500425b743f98f16f28856dd67aaf9f19a52b2}}"
          fish_sha=$(git ls-remote "$PANGEO_FISH_REPO" "refs/heads/$fish_ref" "refs/tags/$fish_ref" | head -n1 | cut -f1)
          # not a branch or tag: assume it is already a commit SHA
          fish_sha="${fish_sha:-$fish_ref}"

          is_default=false
          if [ -z "$INPUT_NOTEBOOK_TAG" ] && [ -z "$INPUT_FISH_REF" ]; then
            is_default=true
          fi

          {
            echo "notebook_tag=$notebook_tag"
            echo "fish_sha=$fish_sha"
            echo "image_tag=${notebook_tag}-${fish_sha:0:7}"
            echo "is_default=$is_default"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this image already exists
        id: check
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          IMAGE_TAG: ${{ steps.versions.outputs.image_tag }}
        run: |
          # Always build for code changes in this repo or when forced;
          # for scheduled / dispatched runs, only build when something changed.
          if [ "$EVENT" = push ] || [ "$EVENT" = pull_request ] || [ "$FORCE" = true ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "$IMAGE:$IMAGE_TAG" > /dev/null 2>&1; then
            echo "$IMAGE:$IMAGE_TAG already exists, nothing to do" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ needs.resolve.outputs.image_tag }}
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      NOTEBOOK_TAG: ${{ needs.resolve.outputs.notebook_tag }}
      FISH_SHA: ${{ needs.resolve.outputs.fish_sha }}
      IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
      IS_DEFAULT: ${{ needs.resolve.outputs.is_default }}
    steps:
      # pangeo-notebook + torch is too large for the default runner disk
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: true

      - uses: actions/checkout@v7

      - name: Build image
        run: |
          docker build \
            --build-arg PANGEO_NOTEBOOK_TAG="$NOTEBOOK_TAG" \
            --build-arg PANGEO_FISH_REPO="$PANGEO_FISH_REPO" \
            --build-arg PANGEO_FISH_REF="$FISH_SHA" \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --label io.github.pangeo-fish.pangeo-fish-commit="$FISH_SHA" \
            --tag "$IMAGE:$IMAGE_TAG" \
            .

      # pangeo_fish.helpers imports most of the package (hmm.prediction, io, ...)
      # and its third-party dependencies at module level, so importing it catches
      # dependencies missing from pyproject.toml, not just a broken install.
      - name: Smoke test
        run: |
          docker run --rm --entrypoint "" "$IMAGE:$IMAGE_TAG" \
            /srv/conda/envs/pangeo-fish/bin/python -c "import importlib.metadata as m, pangeo_fish, pangeo_fish.helpers; print(pangeo_fish.__file__, m.version('pangeo-fish'))"
          docker run --rm --entrypoint "" \
            -v "$PWD/tests:/tmp/coastal-tests:ro" "$IMAGE:$IMAGE_TAG" \
            /srv/conda/envs/pangeo-fish/bin/python \
            /tmp/coastal-tests/smoke_coastal_regrid.py "$FISH_SHA"
          docker run --rm --entrypoint "" \
            -v "$PWD/tests:/tmp/ibi-tests:ro" "$IMAGE:$IMAGE_TAG" \
            /srv/conda/envs/pangeo-fish/bin/python \
            /tmp/ibi-tests/smoke_copernicus_ibi.py
          docker run --rm --entrypoint "" "$IMAGE:$IMAGE_TAG" \
            jupyter kernelspec list | tee /dev/stderr | grep -q pangeo-fish

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to ghcr.io
        if: github.event_name != 'pull_request'
        run: |
          tags=("$IMAGE_TAG")
          # "latest" only for builds of the default versions (not manual pins)
          if [ "$IS_DEFAULT" = true ]; then
            tags+=("latest")
          fi
          for tag in "${tags[@]}"; do
            docker tag "$IMAGE:$IMAGE_TAG" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
            echo "- \`$IMAGE:$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done

      # Optional mirror to Docker Hub: set the repository variable DOCKERHUB_IMAGE
      # (e.g. "pangeofish/pangeo-fish-notebook") and the secrets
      # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && vars.DOCKERHUB_IMAGE != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        if: github.event_name != 'pull_request' && vars.DOCKERHUB_IMAGE != ''
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          tags=("$IMAGE_TAG")
          if [ "$IS_DEFAULT" = true ]; then
            tags+=("latest")
          fi
          for tag in "${tags[@]}"; do
            docker tag "$IMAGE:$IMAGE_TAG" "$DOCKERHUB_IMAGE:$tag"
            docker push "$DOCKERHUB_IMAGE:$tag"
            echo "- \`docker.io/$DOCKERHUB_IMAGE:$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done
